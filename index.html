<!DOCTYPE html>
<html>
<head>
<title>Exchange Dashboard</title>

<style>
body{font-family:Arial;background:#f5f1ec;padding:20px;}
.box{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:10px;}
input,select,textarea{width:100%;padding:8px;margin:5px 0;}
button{padding:10px;background:black;color:#fff;border:none;cursor:pointer;}
.tabs button{margin-right:10px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;}
.status{font-weight:bold;}
.pending{color:orange;}
.done{color:green;}
</style>

</head>

<body>

<div class="box">

<h2>Exchange Dashboard</h2>

<form id="form">
<input name="name" placeholder="Name" required>
<input name="orderId" placeholder="Order ID" required>
<input name="email" placeholder="Email">
<input name="mobile" placeholder="Mobile">

<textarea name="description" placeholder="Conversation"></textarea>

<select name="status">
<option>📩 Mailed</option>
<option>💬 WhatsApp</option>
<option>Exchange Generated</option>
<option>Exchange Sent</option>
<option>Exchange Received</option>
<option>Refund Paid</option>
</select>

<label><input type="checkbox" name="completed"> Mark as Done</label>

<button>Submit</button>
</form>

<div class="tabs">
<button onclick="loadData('pending')">Pending</button>
<button onclick="loadData('done')">Done</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Order ID</th>
<th>Status</th>
<th>Conversation</th>
<th>State</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbxScIudPR-142a4uBaCljYfCYZ2_L85yYGGZXvsIhMQW8LbGozPGJmO8CRxlysOEpqLzg/exec";

// submit
document.getElementById("form").addEventListener("submit", e=>{
  e.preventDefault();
  fetch(URL,{method:"POST", body:new FormData(e.target)})
  .then(()=>{
    e.target.reset();
    loadData('pending');
  });
});

// load data
function loadData(type){
  fetch(URL)
  .then(res=>res.json())
  .then(data=>{
    let html="";

    data.forEach(r=>{

      if(type=="pending" && r.confirmed=="Yes ✔") return;
      if(type=="done" && r.confirmed!="Yes ✔") return;

      let stateClass = r.confirmed=="Yes ✔" ? "done" : "pending";
      let stateText = r.confirmed=="Yes ✔" ? "DONE ✅" : "PENDING ⏳";

      html += `
      <tr>
        <td>${r.name}</td>
        <td>${r.orderId}</td>
        <td class="status">${r.status}</td>
        <td style="white-space:pre-line">${r.description}</td>
        <td class="${stateClass}">${stateText}</td>
      </tr>`;
    });

    document.getElementById("data").innerHTML = html;
  });
}

loadData('pending');

</script>

</body>
</html>
