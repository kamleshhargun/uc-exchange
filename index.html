<!DOCTYPE html>
<html>
<head>
  <title>Exchange Status Form</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f1ec;
      padding: 20px;
    }

    .form-box {
      max-width: 500px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    textarea {
      height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #msg {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="form-box">

  <h2>Exchange Status Update</h2>

  <form id="orderForm">

    <input type="text" name="name" placeholder="Customer Name" required>
    <input type="text" name="orderId" placeholder="Order ID" required>
    <input type="email" name="email" placeholder="Email ID" required>
    <input type="tel" name="mobile" placeholder="Mobile Number" required>

    <textarea name="description" placeholder="Conversation / Description" required></textarea>

    <label>Status</label>
    <select name="status" required>
      <option value="">Select Status</option>
      <option>📩 Mailed</option>
      <option>💬 WhatsApp</option>
      <option>Exchange Generated</option>
      <option>Exchange Sent</option>
      <option>Exchange Received</option>
      <option>Refund Paid</option>
    </select>

    <label>
      <input type="checkbox" name="completed"> ✔ Confirm Update
    </label>

    <button type="submit">Submit</button>

  </form>

  <p id="msg"></p>

</div>

<!-- 🔊 SOUND FILE -->
<audio id="successSound">
  <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  var form = this;
  var formData = new FormData(form);

  document.getElementById("msg").innerText = "⏳ Saving...";

  fetch("https://script.google.com/macros/s/AKfycby9WJwwvAnbcoxz7DL7rfTJ9b1rnjpMXriKIRZAUNagDZaswVlBJ6S0MwYQJeLEw9QBhA/exec", {
    method: "POST",
    body: formData
  })
  .then(res => res.text())
  .then(data => {

    // ✅ SUCCESS MESSAGE
    document.getElementById("msg").innerText = "✅ Saved Successfully!";

    // 🔊 PLAY SOUND
    document.getElementById("successSound").play();

    // 🧹 RESET FORM
    form.reset();

  })
  .catch(err => {
    document.getElementById("msg").innerText = "❌ Error!";
  });

});
</script>

</body>
</html>
