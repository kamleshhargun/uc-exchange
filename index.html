<!DOCTYPE html>
<html>
<head>
  <title>Order Status Form</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f1ec;
      padding: 20px;
    }
    .form-box {
      max-width: 500px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin: auto;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: black;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
  </style>
</head>
<body>

<div class="form-box">
  <h2>Order Status Update</h2>

  <form id="orderForm">
    <input type="text" name="name" placeholder="Customer Name" required>
    <input type="text" name="orderId" placeholder="Order ID" required>
    <input type="email" name="email" placeholder="Email ID" required>
    <input type="text" name="mobile" placeholder="Mobile Number" required>

    <label>Status</label>
    <select name="status" required>
      <option value="">Select Status</option>
      <option>Exchange Generated</option>
      <option>Exchange Sent</option>
      <option>Exchange Received</option>
      <option>Refund Paid</option>
    </select>

    <label>
      <input type="checkbox" name="completed"> ✔ Confirm Status
    </label>

    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>
</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  let formData = new FormData(this);

  fetch("https://script.google.com/macros/s/AKfycbw37ei_C3vt0f_L8vUeibkFg8stMzS3VFGA447WSO7EraVpTHx0xG_S3r6ipkEwg2GMow/exec", {
    method: "POST",
    body: formData
  })
  .then(res => res.text())
  .then(data => {
    document.getElementById("msg").innerText = "Data Saved Successfully!";
    document.getElementById("orderForm").reset();
  })
  .catch(err => {
    document.getElementById("msg").innerText = "Error!";
  });
});
</script>

</body>
</html>
