<!DOCTYPE html>
<html>
<head>
  <title>Exchange Status Form</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f1ec;
      padding: 20px;
    }

    .form-box {
      max-width: 500px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #msg {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="form-box">

  <h2>Exchange Status Update</h2>

  <form id="orderForm">

    <input type="text" name="name" placeholder="Customer Name" required>
    <input type="text" name="orderId" placeholder="Order ID" required>
    <input type="email" name="email" placeholder="Email ID" required>
    <input type="text" name="mobile" placeholder="Mobile Number" required>

    <!-- SINGLE STATUS DROPDOWN -->
    <label>Status</label>
    <select name="status" required>

      <option value="">Select Status</option>

      <option>📩 Mailed</option>
      <option>💬 WhatsApp</option>

      <option>Exchange Generated</option>
      <option>Exchange Sent</option>
      <option>Exchange Received</option>
      <option>Refund Paid</option>

    </select>

    <label>
      <input type="checkbox" name="completed"> ✔ Confirm Update
    </label>

    <button type="submit">Submit</button>

  </form>

  <p id="msg"></p>

</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  var formData = new FormData(this);

  fetch("https://script.google.com/macros/s/AKfycby9WJwwvAnbcoxz7DL7rfTJ9b1rnjpMXriKIRZAUNagDZaswVlBJ6S0MwYQJeLEw9QBhA/exec", {
    method: "POST",
    body: formData
  })
  .then(res => res.text())
  .then(data => {
    document.getElementById("msg").innerText = "✅ Saved Successfully!";
    document.getElementById("orderForm").reset();
  })
  .catch(err => {
    document.getElementById("msg").innerText = "❌ Error!";
  });
});
</script>

</body>
</html>
